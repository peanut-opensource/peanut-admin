name: Security

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Security paths
    runs-on: ubuntu-latest
    outputs:
      security: ${{ steps.paths.outputs.security }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Classify security impact
        id: paths
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo 'security=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "${{ github.event.pull_request.base.sha }}...HEAD")"
          if grep -Eq '^(backend/app/authorization/|backend/app/middleware/|backend/tests/Security/|packages/php/kernel/src/(Auth|Authorization|Context|Tenancy|Membership|Module|Persistence/Schema)/|packages/php/kernel/tests/Integration/(Auth|Authorization|Module)/|packages/php/data-permission/|packages/php/settings/tests/Security/|schemas/|tests/security/|scripts/test-security$|\.github/workflows/security\.yml$)' <<< "$changed"; then
            echo 'security=true' >> "$GITHUB_OUTPUT"
          else
            echo 'security=false' >> "$GITHUB_OUTPUT"
          fi

  qualification:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.security == 'true'
    runs-on: ubuntu-24.04
    env:
      MYSQL_PORT: '3306'
      DB_PORT: '3306'
    steps:
      - name: Checkout full history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          tools: composer:2.10.2
          coverage: none
      - name: Set up pnpm for stage qualification
        if: github.event_name == 'workflow_dispatch'
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.13.0
          run_install: false
      - name: Set up Node for stage qualification
        if: github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: pnpm
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Warm web dependency cache for stage qualification
        if: github.event_name == 'workflow_dispatch'
        run: ./scripts/warm-worktree-dependencies
      - name: Bootstrap web dependencies for stage qualification
        if: github.event_name == 'workflow_dispatch'
        run: ./scripts/bootstrap-worktree-dependencies
      - name: Install browser runtime for stage qualification
        if: github.event_name == 'workflow_dispatch'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Gitleaks 8.30.1 for stage qualification
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive='gitleaks_8.30.1_linux_x64.tar.gz'
          gh release download v8.30.1 \
            --repo gitleaks/gitleaks \
            --pattern "$archive" \
            --pattern 'gitleaks_8.30.1_checksums.txt'
          grep " $archive\$" gitleaks_8.30.1_checksums.txt | sha256sum --check
          tar -xzf "$archive" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
      - name: Run focused security gate
        if: github.event_name == 'pull_request'
        run: ./scripts/test-security --php-only
      - name: Run stage supply-chain gate
        if: github.event_name == 'workflow_dispatch'
        run: ./scripts/check-supply-chain
      - name: Run stage security gate
        if: github.event_name == 'workflow_dispatch'
        run: ./scripts/test-security
