name: Alpha.5 npm Publication

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'peanut-opensource/peanut-admin' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout fixed qualification artifact
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: aeeff105df4960db6a70da7ee5597da9a85abdaa
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable source identity
        run: |
          test "$(git rev-parse HEAD)" = 'aeeff105df4960db6a70da7ee5597da9a85abdaa'
          test "$(git rev-parse HEAD:packages/web)" = '562043a0a294392a66ea0a305de6554d02646bc8'
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.13.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.13.0
          registry-url: https://registry.npmjs.org

      - name: Set up trusted-publishing npm CLI
        run: npm install --global npm@11.6.2

      - name: Reject an existing immutable version
        run: |
          if npm view '@peanut-admin/admin@0.1.0-alpha.5' version >/dev/null 2>&1; then
            echo 'ERROR: immutable Alpha.5 already exists' >&2
            exit 1
          fi
          test "$(npm view '@peanut-admin/admin' dist-tags.latest)" = '0.1.0-alpha.2'

      - name: Materialize and verify the qualified tarball
        run: |
          output="$RUNNER_TEMP/alpha5-npm-publication"
          ./scripts/check-alpha5-npm-package-projection "$output"
          tarball="$output/npm/peanut-admin-admin-0.1.0-alpha.5.tgz"
          test -f "$tarball"
          test "$(gzip -cd "$tarball" | sha256sum | cut -d ' ' -f 1)" = '5850166ab965aa7ccb8d85058dd68a025c4741e9bc7b7af5c51536a8977b6eb6'
          printf 'ALPHA5_TARBALL=%s\n' "$tarball" >> "$GITHUB_ENV"

      - name: Publish qualified tarball with provenance
        run: npm publish "$ALPHA5_TARBALL" --access public --tag alpha --provenance

      - name: Verify immutable registry result
        run: |
          test "$(npm view '@peanut-admin/admin@0.1.0-alpha.5' version)" = '0.1.0-alpha.5'
          test "$(npm view '@peanut-admin/admin' dist-tags.alpha)" = '0.1.0-alpha.5'
          test "$(npm view '@peanut-admin/admin' dist-tags.latest)" = '0.1.0-alpha.2'
          registry_tarball="$RUNNER_TEMP/peanut-admin-admin-0.1.0-alpha.5.tgz"
          curl --fail --silent --show-error --location \
            --output "$registry_tarball" \
            "$(npm view '@peanut-admin/admin@0.1.0-alpha.5' dist.tarball)"
          test "$(gzip -cd "$registry_tarball" | sha256sum | cut -d ' ' -f 1)" = '5850166ab965aa7ccb8d85058dd68a025c4741e9bc7b7af5c51536a8977b6eb6'
          consumer="$RUNNER_TEMP/alpha5-npm-consumer"
          mkdir -p "$consumer"
          cd "$consumer"
          npm init --yes >/dev/null
          npm install --ignore-scripts '@peanut-admin/admin@0.1.0-alpha.5'
          npm audit signatures
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises'
          const manifest = JSON.parse(await readFile('node_modules/@peanut-admin/admin/package.json', 'utf8'))
          const expected = ['./core', './shell', './settings', './reference-codes', './file-media', './task-job', './notification-sms', './import-export', './ops-console', './integration-security', './collaboration', './testing', './client', './client/nuxt', './client/uniapp'].sort()
          const actual = Object.keys(manifest.exports ?? {}).sort()
          if (manifest.version !== '0.1.0-alpha.5' || JSON.stringify(actual) !== JSON.stringify(expected)) process.exit(1)
          NODE
