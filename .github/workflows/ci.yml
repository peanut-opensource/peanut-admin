name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    outputs:
      php: ${{ steps.paths.outputs.php }}
      web: ${{ steps.paths.outputs.web }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Classify affected runtimes
        id: paths
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo 'php=true' >> "$GITHUB_OUTPUT"
            echo 'web=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed="$(git diff --name-only "${{ github.event.pull_request.base.sha }}...HEAD")"
          matches() {
            grep -Eq "$1" <<< "$changed"
          }

          matches '^(backend/|packages/php/|schemas/|composer\.(json|lock)$|phpstan\.neon$|phpunit\.xml$|deptrac\.yaml$|scripts/|tests/|\.github/workflows/ci\.yml$)' \
            && echo 'php=true' >> "$GITHUB_OUTPUT" || echo 'php=false' >> "$GITHUB_OUTPUT"
          matches '^(frontend/|packages/web/|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|eslint\.config\.js$|tsconfig\.|vitest\.|scripts/|\.github/workflows/ci\.yml$)' \
            && echo 'web=true' >> "$GITHUB_OUTPUT" || echo 'web=false' >> "$GITHUB_OUTPUT"

  php:
    name: PHP fast
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.php == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          tools: composer:2.10.2
          coverage: none
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Run focused PHP gates
        env:
          CI_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: ./scripts/check-pr-fast --php

  web:
    name: Web fast
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.13.0
          run_install: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: pnpm
      - name: Warm web dependency cache
        run: ./scripts/warm-worktree-dependencies
      - name: Bootstrap web dependencies offline
        run: ./scripts/bootstrap-worktree-dependencies
      - name: Run focused Web gates
        env:
          CI_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: ./scripts/check-pr-fast --web

  stage:
    name: Stage integration
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      MYSQL_PORT: '3306'
      DB_PORT: '3306'
      CACHE_PORT: '6379'
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          tools: composer:2.10.2
          coverage: none
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.13.0
          run_install: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: pnpm
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Warm web dependency cache
        run: ./scripts/warm-worktree-dependencies
      - name: Bootstrap web dependencies offline
        run: ./scripts/bootstrap-worktree-dependencies
      - name: Install browser runtime
        run: pnpm exec playwright install --with-deps chromium
      - name: Run stage integration gates
        run: ./scripts/check-pr-quality

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
