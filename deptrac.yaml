deptrac:
  paths:
    - backend/app
    - packages/php/kernel/src
    - packages/php/data-permission/src
    - packages/php/settings/src
    - packages/php/testing/src
  exclude_files:
    - '#.*tests.*#'
  layers:
    - name: Framework
      collectors:
        - type: classNameRegex
          value: '#^think\\#'
    - name: RuntimeLibraries
      collectors:
        - type: classNameRegex
          value: '#^(Opis\\JsonSchema|Composer\\(Semver|InstalledVersions)|Phinx\\)#'
    - name: Kernel
      collectors:
        - type: classNameRegex
          value: '#^PeanutAdmin\\Kernel\\#'
    - name: DataPermission
      collectors:
        - type: classNameRegex
          value: '#^PeanutAdmin\\DataPermission\\#'
    - name: Settings
      collectors:
        - type: classNameRegex
          value: '#^PeanutAdmin\\Settings\\#'
    - name: Testing
      collectors:
        - type: classNameRegex
          value: '#^PeanutAdmin\\Testing\\#'
    - name: Backend
      collectors:
        - type: classNameRegex
          value: '#^PeanutAdmin\\App\\(?!Modules\\)#'
    - name: ModuleContracts
      collectors:
        - type: classNameRegex
          value: '#^PeanutAdmin\\App\\Modules\\.+\\Contracts\\#'
    - name: ModuleInternals
      collectors:
        - type: classNameRegex
          value: '#^PeanutAdmin\\App\\Modules\\(?!.*\\Contracts\\)#'
  ruleset:
    Kernel: []
    DataPermission:
      - Kernel
    Settings:
      - RuntimeLibraries
      - Kernel
    Testing:
      - Kernel
      - DataPermission
    Backend:
      - Framework
      - RuntimeLibraries
      - Kernel
      - DataPermission
      - Settings
      - ModuleContracts
    ModuleContracts:
      - Kernel
      - DataPermission
    ModuleInternals:
      - Framework
      - Kernel
      - DataPermission
      - Settings
      - ModuleContracts
