FileKey:
  type: string
  pattern: '^file_[0-9a-f]{32}$'

StrongFileEtag:
  type: string
  pattern: '^"rev-[1-9][0-9]*"$'

FileContent:
  type: string
  format: binary

FileObject:
  type: object
  additionalProperties: false
  required: [file_key, original_name, media_type, size_bytes, sha256, status, revision, created_at, updated_at, archived_at]
  properties:
    file_key: { $ref: '#/FileKey' }
    original_name: { type: string, minLength: 1, maxLength: 255 }
    media_type: { type: string, minLength: 1, maxLength: 127 }
    size_bytes: { type: integer, minimum: 1, maximum: 10485760 }
    sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
    status: { enum: [ready, archived] }
    revision: { type: integer, minimum: 1 }
    created_at: { type: string, format: date-time }
    updated_at: { type: string, format: date-time }
    archived_at:
      anyOf:
        - { type: string, format: date-time }
        - { type: 'null' }

FileResponse:
  type: object
  additionalProperties: false
  required: [data, meta]
  properties:
    data: { $ref: '#/FileObject' }
    meta: { $ref: './common.yaml#/$defs/RequestMeta' }

FileListResponse:
  type: object
  additionalProperties: false
  required: [data, meta]
  properties:
    data:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/FileObject' }
    meta:
      allOf:
        - { $ref: './common.yaml#/$defs/RequestMeta' }
        - type: object
          required: [page, page_size, total]
          properties:
            page: { type: integer, minimum: 1 }
            page_size: { type: integer, minimum: 1, maximum: 100 }
            total: { type: integer, minimum: 0 }
