TargetCandidate:
  type: object
  additionalProperties: false
  required: [target_resource_key, target_id, label]
  properties:
    target_resource_key: { type: string }
    target_id: { type: string }
    label: { type: string }

TargetCandidateMeta:
  type: object
  additionalProperties: false
  required: [request_id, page, page_size, total, total_pages, target_cardinality, available_count]
  properties:
    request_id: { type: string }
    page: { type: integer, minimum: 1 }
    page_size: { type: integer, minimum: 1, maximum: 100 }
    total: { type: integer, minimum: 0 }
    total_pages: { type: integer, minimum: 0 }
    target_cardinality: { enum: [none, single, multiple] }
    available_count: { type: integer, minimum: 0 }

TargetCandidateListResponse:
  type: object
  additionalProperties: false
  required: [data, meta]
  properties:
    data: { type: array, items: { $ref: '#/TargetCandidate' } }
    meta: { $ref: '#/TargetCandidateMeta' }

DataPolicyTarget:
  type: object
  additionalProperties: false
  required: [target_id]
  properties:
    target_id: { type: string }

DataPolicyTargetSet:
  type: object
  additionalProperties: false
  required: [id, name, target_mode, target_resource_key, status, revision, targets]
  properties:
    id: { $ref: './common.yaml#/$defs/BigIntString' }
    name: { type: string }
    target_mode: { type: string }
    target_resource_key: { type: string }
    status: { type: string }
    revision: { $ref: './common.yaml#/$defs/BigIntString' }
    targets: { type: array, items: { $ref: '#/DataPolicyTarget' } }

DataPolicyCondition:
  type: object
  additionalProperties: false
  required: [id, condition_key, status, revision, target_set, config]
  properties:
    id: { $ref: './common.yaml#/$defs/BigIntString' }
    condition_key: { type: string }
    status: { type: string }
    revision: { $ref: './common.yaml#/$defs/BigIntString' }
    target_set:
      oneOf:
        - { $ref: '#/DataPolicyTargetSet' }
        - { type: 'null' }
    config: { type: [object, 'null'], additionalProperties: true }

DataPolicyGroup:
  type: object
  additionalProperties: false
  required: [id, name, match_mode, sort_order, status, revision, conditions]
  properties:
    id: { $ref: './common.yaml#/$defs/BigIntString' }
    name: { type: string }
    match_mode: { type: string }
    sort_order: { type: integer }
    status: { type: string }
    revision: { $ref: './common.yaml#/$defs/BigIntString' }
    conditions: { type: array, items: { $ref: '#/DataPolicyCondition' } }

DataPolicy:
  type: object
  additionalProperties: false
  required: [id, tenant_id, role_id, resource_key, operation, status, revision, groups, created_at, updated_at]
  properties:
    id: { $ref: './common.yaml#/$defs/BigIntString' }
    tenant_id: { $ref: './common.yaml#/$defs/BigIntString' }
    role_id: { $ref: './common.yaml#/$defs/BigIntString' }
    resource_key: { type: string }
    operation: { type: string }
    status: { enum: [active, disabled] }
    valid_from: { type: [string, 'null'] }
    valid_until: { type: [string, 'null'] }
    revision: { $ref: './common.yaml#/$defs/BigIntString' }
    reason: { type: [string, 'null'] }
    groups: { type: array, items: { $ref: '#/DataPolicyGroup' } }
    created_at: { type: string }
    updated_at: { type: string }

DataPolicyResponse:
  type: object
  additionalProperties: false
  required: [data, meta]
  properties:
    data: { $ref: '#/DataPolicy' }
    meta: { $ref: './common.yaml#/$defs/RequestMeta' }

DataPolicyTargetSetWrite:
  type: object
  additionalProperties: false
  required: [name, target_resource_key, targets]
  properties:
    name: { type: string, minLength: 1, maxLength: 120 }
    target_resource_key: { type: string, minLength: 1 }
    targets:
      type: array
      minItems: 1
      maxItems: 500
      items:
        type: object
        additionalProperties: false
        required: [target_id]
        properties:
          target_id: { type: string, minLength: 1, maxLength: 128 }

DataPolicyConditionWrite:
  type: object
  additionalProperties: false
  required: [condition_key]
  properties:
    condition_key: { type: string, minLength: 1 }
    target_set:
      oneOf:
        - { $ref: '#/DataPolicyTargetSetWrite' }
        - { type: 'null' }

DataPolicyGroupWrite:
  type: object
  additionalProperties: false
  required: [name, conditions]
  properties:
    name: { type: string, minLength: 1, maxLength: 120 }
    conditions:
      type: array
      minItems: 1
      maxItems: 50
      items: { $ref: '#/DataPolicyConditionWrite' }

ReplaceDataPolicyRequest:
  type: object
  additionalProperties: false
  required: [status, groups]
  properties:
    status: { enum: [active, disabled] }
    reason: { type: [string, 'null'], maxLength: 300 }
    valid_from: { type: [string, 'null'], format: date-time }
    valid_until: { type: [string, 'null'], format: date-time }
    groups:
      type: array
      maxItems: 50
      items: { $ref: '#/DataPolicyGroupWrite' }
