components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  parameters:
    Page: { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
    PageSize: { in: query, name: page_size, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    IfMatch: { in: header, name: If-Match, required: true, schema: { type: string, pattern: '^"rev-[1-9][0-9]*"$' } }
    IdempotencyKey: { in: header, name: Idempotency-Key, required: true, schema: { type: string, minLength: 16, maxLength: 128 } }
    TenantId: { in: path, name: tenant_id, required: true, schema: { $ref: './schemas/common.yaml#/$defs/BigIntString' } }
    MemberId: { in: path, name: member_id, required: true, schema: { $ref: './schemas/common.yaml#/$defs/BigIntString' } }
    DepartmentId: { in: path, name: department_id, required: true, schema: { $ref: './schemas/common.yaml#/$defs/BigIntString' } }
    RoleId: { in: path, name: role_id, required: true, schema: { $ref: './schemas/common.yaml#/$defs/BigIntString' } }
    OperatorId: { in: path, name: operator_id, required: true, schema: { $ref: './schemas/common.yaml#/$defs/BigIntString' } }
    ModuleKey: { in: path, name: module_key, required: true, schema: { type: string, pattern: '^[a-z][a-z0-9.-]+$' } }
  requestBodies:
    GenericWrite:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              email: { type: string, format: email }
              password: { type: string, writeOnly: true }
              tenant_code: { type: [string, 'null'] }
              challenge_token: { type: string, writeOnly: true }
              display_name: { type: [string, 'null'], maxLength: 160 }
              initial_password: { type: string, writeOnly: true }
              code: { type: string, maxLength: 96 }
              name: { type: string, maxLength: 160 }
              description: { type: [string, 'null'], maxLength: 500 }
              locale: { type: string }
              timezone: { type: string }
              parent_id: { type: [string, 'null'] }
              primary_department_id: { type: [string, 'null'] }
              sort_order: { type: integer }
              role_ids: { type: array, uniqueItems: true, items: { type: string } }
              permission_keys: { type: array, uniqueItems: true, items: { type: string } }
              status: { type: string }
              source: { type: string }
              config: { type: object }
              effective_at: { type: [string, 'null'], format: date-time }
              expires_at: { type: [string, 'null'], format: date-time }
              change_reason: { type: string, maxLength: 500 }
              reason: { type: string, maxLength: 500 }
              groups: { type: array, items: { type: object } }
              targets: { type: array, items: { $ref: './schemas/common.yaml#/$defs/TargetSet' } }
  responses:
    Problem:
      description: RFC 9457 problem response
      content:
        application/problem+json:
          schema: { $ref: './schemas/common.yaml#/$defs/Problem' }
