/api/v1/departments:
  get:
    operationId: listDepartments
    x-permission: core.department.read
    responses: { '200': { description: Paginated departments } }
  post:
    operationId: createDepartment
    x-permission: core.department.create
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../schemas/department.yaml#/WriteDepartmentRequest' }
    responses: { '201': { description: Department created }, '422': { description: Parent or depth invalid } }

/api/v1/departments/{department_id}:
  get:
    operationId: getDepartment
    x-permission: core.department.read
    responses: { '200': { description: Department } }
  patch:
    operationId: updateDepartment
    x-permission: core.department.update
    parameters:
      - { in: header, name: If-Match, required: true, schema: { type: string } }
    responses: { '200': { description: Department updated } }

/api/v1/departments/{department_id}/move:
  post:
    operationId: moveDepartment
    x-permission: core.department.move
    parameters:
      - { in: header, name: If-Match, required: true, schema: { type: string } }
    responses: { '200': { description: Department moved }, '422': { description: Cycle or depth invalid } }

/api/v1/departments/{department_id}/archive:
  post:
    operationId: archiveDepartment
    x-permission: core.department.archive
    parameters:
      - { in: header, name: If-Match, required: true, schema: { type: string } }
    responses: { '200': { description: Department archived }, '409': { description: Department not empty } }
