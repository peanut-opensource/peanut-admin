/api/platform/v1/tenants/{tenant_id}/owner-candidates:
  post:
    operationId: createTenantOwnerCandidate
    x-permission: platform.tenant.provision-owner
    description: Creates a pending owner for an existing provisioning tenant. It never creates the tenant.
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../schemas/tenant-owner.yaml#/CreateTenantOwnerCandidateRequest' }
    responses: { '201': { description: Pending owner candidate created }, '409': { description: Candidate already exists } }

/api/platform/v1/tenants/{tenant_id}/owner-candidates/{member_id}/activate:
  post:
    operationId: activateTenantOwnerCandidate
    x-permission: platform.tenant.provision-owner
    parameters:
      - { in: header, name: If-Match, required: true, schema: { type: string } }
      - { in: header, name: Idempotency-Key, required: true, schema: { type: string } }
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../schemas/tenant-owner.yaml#/ActivateTenantOwnerCandidateRequest' }
    responses: { '200': { description: Owner candidate activated }, '409': { description: Owner state conflict }, '412': { description: Revision mismatch } }
