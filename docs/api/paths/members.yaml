/api/v1/members:
  get:
    operationId: listMembers
    x-permission: core.member.read
    parameters:
      - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
      - { in: query, name: page_size, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    responses: { '200': { description: Paginated tenant members } }
  post:
    operationId: createPendingMember
    x-permission: core.member.create
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../schemas/member.yaml#/CreateMemberRequest' }
    responses: { '201': { description: Pending member created } }

/api/v1/members/{member_id}:
  parameters:
    - { in: path, name: member_id, required: true, schema: { type: string, pattern: '^[1-9][0-9]*$' } }
  get:
    operationId: getMember
    x-permission: core.member.read
    responses: { '200': { description: Tenant member } }
  patch:
    operationId: updateMember
    x-permission: core.member.update
    parameters:
      - { in: header, name: If-Match, required: true, schema: { type: string } }
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../schemas/member.yaml#/UpdateMemberRequest' }
    responses: { '200': { description: Updated member }, '412': { description: Revision mismatch }, '428': { description: If-Match missing } }

/api/v1/members/{member_id}/roles:
  put:
    operationId: replaceMemberRoles
    x-permission: core.member.role.assign
    parameters:
      - { in: path, name: member_id, required: true, schema: { type: string } }
      - { in: header, name: If-Match, required: true, schema: { type: string } }
    responses: { '200': { description: Replaced role set } }

/api/v1/members/{member_id}/activate:
  post:
    operationId: activateMember
    x-permission: core.member.activate
    parameters:
      - { in: path, name: member_id, required: true, schema: { type: string } }
      - { in: header, name: If-Match, required: true, schema: { type: string } }
    responses: { '200': { description: Member activated }, '409': { description: Invalid transition } }

/api/v1/members/{member_id}/suspend:
  post:
    operationId: suspendMember
    x-permission: core.member.suspend
    parameters:
      - { in: path, name: member_id, required: true, schema: { type: string } }
      - { in: header, name: If-Match, required: true, schema: { type: string } }
    responses: { '200': { description: Member suspended }, '409': { description: Invalid transition or final owner guard } }

/api/v1/members/{member_id}/leave:
  post:
    operationId: leaveMember
    x-permission: core.member.leave
    parameters:
      - { in: path, name: member_id, required: true, schema: { type: string } }
      - { in: header, name: If-Match, required: true, schema: { type: string } }
    responses: { '200': { description: Member left the tenant }, '409': { description: Invalid transition or final owner guard } }
